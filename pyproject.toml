[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "twowayfeweights"
dynamic = ["version"]
description = "Estimate the weights attached to two-way fixed effects regressions (de Chaisemartin & D'Haultfoeuille, 2020)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Anzony Quispe", email = "anzony.quispe@gmail.com" },
    { name = "Clément de Chaisemartin" },
    { name = "Xavier D'Haultfoeuille" },
    { name = "Diego Ciccia" },
    { name = "Felix Knau" },
]
maintainers = [{ name = "Anzony Quispe", email = "anzony.quispe@gmail.com" }]
keywords = ["difference-in-differences", "two-way fixed effects", "TWFE", "econometrics", "causal inference", "negative weights"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest>=7"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]

[project.urls]
Homepage = "https://github.com/Credible-Answers/py_twowayfeweights"
Documentation = "https://credible-answers.github.io/py_twowayfeweights/"
Source = "https://github.com/Credible-Answers/py_twowayfeweights"
Issues = "https://github.com/Credible-Answers/py_twowayfeweights/issues"
Changelog = "https://github.com/Credible-Answers/py_twowayfeweights/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/twowayfeweights/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/twowayfeweights"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "mkdocs.yml", "README.md", "LICENSE", "CHANGELOG.md"]
exclude = ["tests/reference/work"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.*varies within some group:UserWarning"]
