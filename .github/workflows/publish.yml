# Publishes to PyPI when a GitHub release is published, using PyPI Trusted Publishing (no API token).
# One-time setup on pypi.org: add a "pending publisher" for project `twowayfeweights`
# (owner/repo of this repository, workflow `publish.yml`, environment `pypi`).
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "testpypi or pypi"
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The package version comes from the release tag: v0.1.1 -> 0.1.1.
      - name: Set version from the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python .github/set_version.py "$TAG"
      - run: python -m pip install build twine ".[test]"
      - run: python -m pytest -q
      - run: python -m build
      - name: Check the built version matches the tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: ls dist/ | grep -F "twowayfeweights-${TAG#v}"
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
